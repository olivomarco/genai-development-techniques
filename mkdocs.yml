site_name: GenAI Development Techniques
site_description: Evidence-based comparison of techniques, methodologies, and frameworks for structured AI-assisted software development.
site_author: Marco Olivo
repo_url: https://github.com/olivomarco/genai-development-techniques
edit_uri: edit/main/

docs_dir: docs-staging
site_dir: site

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Guide:
      - Home: index.md
      - Overview: overview.md
      - Choosing your approach: techniques/choosing-your-approach.md
      - Research methodology: methodology.md
      - Market updates: market-updates.md
  - Techniques:
      - GSD: techniques/gsd.md
      - Spec Kit: techniques/spec-kit.md
      - OpenSpec: techniques/openspec.md
      - Squad: techniques/squad.md
      - BMAD Method: techniques/bmad.md
      - Ralph: techniques/ralph.md
      - HVE: techniques/hve.md
      - Context engineering: techniques/context-engineering.md
  - Skills and agent frameworks:
      - State of the skills market: techniques/skills-ecosystem.md
      - Skill libraries: techniques/skills-libraries.md
      - Orchestrating modes: techniques/skills-orchestrating-modes.md
      - Superpowers: techniques/superpowers.md
      - Distribution and governance: techniques/skills-management.md
      - Choosing a skills approach: techniques/skills-choosing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search