<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HVE: artifacts across four phases</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Roboto:wght@400;500;600&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
</head>
<body class="diagram-page">
  <main>
    <h1>HVE: artifacts across four phases</h1>
    <figure class="site-diagram">
      <style>
        body.diagram-page { margin: 0; padding: 32px; background: #ffffff; color: #212121; font-family: 'Roboto', sans-serif; }
        .diagram-page main { max-width: 1200px; margin: auto; min-width: 0; }
        .diagram-page h1 { font: 400 28px 'Instrument Serif', serif; }
        .site-diagram { --d-paper: #ffffff; --d-surface: #f5f5f5; --d-ink: #212121; --d-muted: #616161; --d-rule: #757575; --d-accent: #4051b5; --d-tint: #eef0fa; margin: 24px 0; max-width: 100%; min-width: 0; color: var(--d-ink); }
        [data-md-color-scheme="slate"] .site-diagram { --d-paper: #1e2129; --d-surface: #272b35; --d-ink: #e1e1e3; --d-muted: #b3b6be; --d-rule: #9499a6; --d-accent: #9fb7ff; --d-tint: #2c354f; }
        figure.site-diagram { display: block; container-type: inline-size; width: 100%; }
        .site-diagram .scroll-hint { display: none; color: var(--d-muted); font: 400 14px/1.5 'Roboto', sans-serif; }
        @container (max-width: 959px) { .site-diagram .scroll-hint { display: block; } }
        .site-diagram .diagram-container { width: 100%; overflow-x: auto; }
        .site-diagram .diagram-container:focus-visible { outline: 2px solid var(--d-accent); outline-offset: 2px; }
        .site-diagram svg { display: block; width: 100%; min-width: 960px; font-family: 'Roboto', sans-serif; }
        .site-diagram text { fill: var(--d-ink); font-size: 12px; }
        .site-diagram .name { font-weight: 600; }
        .site-diagram .heading { font-size: 14px; font-weight: 600; }
        .site-diagram .note { fill: var(--d-muted); }
        .site-diagram .tag { fill: var(--d-muted); font: 400 8px 'Roboto Mono', monospace; letter-spacing: .06em; }
        .site-diagram .tech { fill: var(--d-muted); font: 400 9px 'Roboto Mono', monospace; }
        .site-diagram .box { fill: var(--d-paper); stroke: var(--d-rule); }
        .site-diagram .focal { fill: var(--d-tint); stroke: var(--d-accent); }
        .site-diagram .route { fill: none; stroke: var(--d-muted); stroke-width: 1.2; }
        .site-diagram .rule { stroke: var(--d-rule); stroke-width: .8; }
        .site-diagram figcaption { margin-top: 12px; color: var(--d-muted); font: 400 14px/1.5 'Roboto', sans-serif; }
        @media (prefers-color-scheme: dark) {
          body.diagram-page { background: #1e2129; color: #e1e1e3; }
          .diagram-page .site-diagram { --d-paper: #1e2129; --d-surface: #272b35; --d-ink: #e1e1e3; --d-muted: #b3b6be; --d-rule: #9499a6; --d-accent: #9fb7ff; --d-tint: #2c354f; }
        }
        @media print {
          .site-diagram .scroll-hint { display: none; }
          .site-diagram .diagram-container { overflow-x: visible; }
          .site-diagram svg { min-width: 0; }
        }
      </style>
      <p class="scroll-hint">Scroll horizontally to view the full diagram.</p>
      <div class="diagram-container" tabindex="0" role="region" aria-label="HVE workflow diagram; scroll horizontally on narrow screens">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="hve-workflow-title hve-workflow-desc">
          <title id="hve-workflow-title">HVE: artifacts across four phases</title>
          <desc id="hve-workflow-desc">Research turns uncertainty into knowledge, planning turns knowledge into strategy, implementation produces working code, and review validates it, with dedicated agents and durable artifacts at each handoff.</desc>
          <defs>
            <marker id="hve-workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="var(--d-muted)"/></marker>
            <marker id="hve-workflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="var(--d-accent)"/></marker>
            <marker id="hve-workflow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="var(--d-accent)"/></marker>
          </defs>
          <rect width="960" height="600" fill="var(--d-paper)"/>
          <text x="40" y="96" class="note">A different agent for each phase; files carry evidence into the next phase.</text>
          <path class="route" d="M240 296 H264" marker-end="url(#hve-workflow-arrow)"/>
          <path class="route" d="M464 296 H488" marker-end="url(#hve-workflow-arrow)"/>
          <path class="route" d="M688 296 H712" marker-end="url(#hve-workflow-arrow)"/>
          <rect x="40" y="144" width="200" height="304" rx="6" class="box"/>
          <rect x="264" y="144" width="200" height="304" rx="6" class="box"/>
          <rect x="488" y="144" width="200" height="304" rx="6" class="box"/>
          <rect x="712" y="144" width="200" height="304" rx="6" class="focal"/>
          <text x="56" y="180" class="heading">Research</text>
          <text x="56" y="208" class="tag">AGENT</text>
          <text x="56" y="228" class="name">Task Researcher</text>
          <text x="56" y="272" class="tag">INPUT</text>
          <text x="56" y="292">Uncertainty</text>
          <text x="56" y="336" class="tag">OUTPUT</text>
          <text x="56" y="356" class="name">Knowledge</text>
          <text x="56" y="384" class="note">Evidence + recommendation</text>
          <text x="280" y="180" class="heading">Plan</text>
          <text x="280" y="208" class="tag">AGENT</text>
          <text x="280" y="228" class="name">Task Planner</text>
          <text x="280" y="272" class="tag">INPUT</text>
          <text x="280" y="292">Knowledge</text>
          <text x="280" y="336" class="tag">OUTPUT</text>
          <text x="280" y="356" class="name">Strategy</text>
          <text x="280" y="384" class="note">Plan + details files</text>
          <text x="504" y="180" class="heading">Implement</text>
          <text x="504" y="208" class="tag">AGENT</text>
          <text x="504" y="228" class="name">Task Implementor</text>
          <text x="504" y="272" class="tag">INPUT</text>
          <text x="504" y="292">Strategy</text>
          <text x="504" y="336" class="tag">OUTPUT</text>
          <text x="504" y="356" class="name">Working code</text>
          <text x="504" y="384" class="note">Code + changes record</text>
          <text x="728" y="180" class="heading">Review</text>
          <text x="728" y="208" class="tag">AGENT</text>
          <text x="728" y="228" class="name">Task Reviewer</text>
          <text x="728" y="272" class="tag">INPUT</text>
          <text x="728" y="292">Working code</text>
          <text x="728" y="336" class="tag">OUTPUT</text>
          <text x="728" y="356" class="name">Validated code</text>
          <text x="728" y="384" class="note">Review + lint/build/test</text>
          <text x="40" y="492" class="note">Clear context between phases rather than carrying the full conversation forward.</text>
          <line x1="40" y1="540" x2="920" y2="540" class="rule"/>
          <path class="route" d="M40 568 H72" marker-end="url(#hve-workflow-arrow)"/>
          <text x="88" y="572" class="tech">Artifact handoff</text>
          <rect x="352" y="560" width="12" height="12" rx="2" class="focal"/>
          <text x="376" y="570" class="tech">Validation, not code generation alone</text>
        </svg>
      </div>
      <figcaption>The same agent/input/output slots repeat across all four phases. The table below retains exact artifact names and each agent's responsibilities.</figcaption>
    </figure>
  </main>
</body>
</html>
