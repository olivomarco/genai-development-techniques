<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complexity vs. speed spectrum</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Roboto:wght@400;500;600&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
</head>
<body class="diagram-page">
  <main>
    <h1>Complexity vs. speed spectrum</h1>
    <figure class="site-diagram">
      <style>
        body.diagram-page { margin: 0; padding: 32px; background: #ffffff; color: #212121; font-family: 'Roboto', sans-serif; }
        .diagram-page main { max-width: 1200px; margin: auto; min-width: 0; }
        .diagram-page h1 { font: 400 28px 'Instrument Serif', serif; }
        .site-diagram { --d-paper: #ffffff; --d-surface: #f5f5f5; --d-ink: #212121; --d-muted: #616161; --d-rule: #757575; --d-accent: #4051b5; --d-tint: #eef0fa; margin: 24px 0; max-width: 100%; min-width: 0; color: var(--d-ink); }
        [data-md-color-scheme="slate"] .site-diagram { --d-paper: #1e2129; --d-surface: #272b35; --d-ink: #e1e1e3; --d-muted: #b3b6be; --d-rule: #9499a6; --d-accent: #9fb7ff; --d-tint: #2c354f; }
        figure.site-diagram { display: block; container-type: inline-size; width: 100%; }
        .site-diagram .scroll-hint { display: none; color: var(--d-muted); font: 400 14px/1.5 'Roboto', sans-serif; }
        @container (max-width: 959px) { .site-diagram .scroll-hint { display: block; } }
        .site-diagram .diagram-container { width: 100%; overflow-x: auto; }
        .site-diagram .diagram-container:focus-visible { outline: 2px solid var(--d-accent); outline-offset: 2px; }
        .site-diagram svg { display: block; width: 100%; min-width: 960px; font-family: 'Roboto', sans-serif; }
        .site-diagram text { fill: var(--d-ink); font-size: 12px; }
        .site-diagram .name { font-weight: 600; }
        .site-diagram .note { fill: var(--d-muted); }
        .site-diagram .tag { fill: var(--d-muted); font: 400 8px 'Roboto Mono', monospace; letter-spacing: .06em; }
        .site-diagram .tech { fill: var(--d-muted); font: 400 9px 'Roboto Mono', monospace; }
        .site-diagram .rule { stroke: var(--d-rule); stroke-width: .8; }
        .site-diagram figcaption { margin-top: 12px; color: var(--d-muted); font: 400 14px/1.5 'Roboto', sans-serif; }
        @media (prefers-color-scheme: dark) {
          body.diagram-page { background: #1e2129; color: #e1e1e3; }
          .diagram-page .site-diagram { --d-paper: #1e2129; --d-surface: #272b35; --d-ink: #e1e1e3; --d-muted: #b3b6be; --d-rule: #9499a6; --d-accent: #9fb7ff; --d-tint: #2c354f; }
        }
        @media print {
          .site-diagram .scroll-hint { display: none; }
          .site-diagram .diagram-container { overflow-x: visible; }
          .site-diagram svg { min-width: 0; }
        }
      </style>
      <p class="scroll-hint">Scroll horizontally to view the full diagram.</p>
      <div class="diagram-container" tabindex="0" role="region" aria-label="Technique spectrum diagram; scroll horizontally on narrow screens">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="technique-spectrum-title technique-spectrum-desc">
          <title id="technique-spectrum-title">Complexity vs. speed spectrum</title>
          <desc id="technique-spectrum-desc">The comparison positions Context Engineering and Ralph toward a faster start, followed by GSD, Superpowers, OpenSpec, Spec Kit, Squad, BMAD, and HVE toward more structure.</desc>
          <defs>
            <marker id="technique-spectrum-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="var(--d-muted)"/></marker>
            <marker id="technique-spectrum-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="var(--d-accent)"/></marker>
            <marker id="technique-spectrum-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="var(--d-accent)"/></marker>
          </defs>
          <rect width="960" height="600" fill="var(--d-paper)"/>
          <line x1="80" y1="300" x2="880" y2="300" stroke="var(--d-muted)" marker-end="url(#technique-spectrum-arrow)"/>
          <line x1="480" y1="520" x2="480" y2="80" stroke="var(--d-muted)" marker-end="url(#technique-spectrum-arrow)"/>
          <text x="480" y="60" text-anchor="middle" class="tech">FASTER</text>
          <text x="480" y="536" text-anchor="middle" class="tech">SLOWER</text>
          <text x="64" y="304" text-anchor="end" class="tech">LIGHT</text>
          <text x="896" y="304" class="tech">STRUCTURE</text>
          <circle cx="144" cy="112" r="4" fill="var(--d-ink)"/>
          <text x="156" y="116" class="name">Context Engineering</text>
          <circle cx="224" cy="160" r="4" fill="var(--d-ink)"/>
          <text x="236" y="164" class="name">Ralph</text>
          <circle cx="304" cy="208" r="4" fill="var(--d-ink)"/>
          <text x="316" y="212" class="name">GSD</text>
          <circle cx="384" cy="256" r="4" fill="var(--d-ink)"/>
          <text x="396" y="260" class="name">Superpowers</text>
          <circle cx="560" cy="336" r="4" fill="var(--d-accent)"/>
          <text x="572" y="340" class="name">OpenSpec</text>
          <circle cx="640" cy="376" r="4" fill="var(--d-ink)"/>
          <text x="652" y="380" class="name">Spec Kit</text>
          <circle cx="704" cy="416" r="4" fill="var(--d-ink)"/>
          <text x="716" y="420" class="name">Squad</text>
          <circle cx="768" cy="456" r="4" fill="var(--d-ink)"/>
          <text x="780" y="460" class="name">BMAD</text>
          <circle cx="832" cy="496" r="4" fill="var(--d-ink)"/>
          <text x="844" y="500" class="name">HVE</text>
          <line x1="40" y1="548" x2="920" y2="548" class="rule"/>
          <circle cx="48" cy="568" r="4" fill="var(--d-ink)"/>
          <text x="64" y="572" class="tech">Qualitative positioning; no measured scores</text>
          <circle cx="480" cy="568" r="4" fill="var(--d-accent)"/>
          <text x="496" y="572" class="tech">OpenSpec: change-level specifications</text>
        </svg>
      </div>
      <figcaption>Placement preserves this comparison's editorial ordering, not measured development speed or predictability. Setup and tool details are listed below.</figcaption>
    </figure>
  </main>
</body>
</html>
